<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <rect width="1280" height="640" fill="#0b1220"/>

  <!-- requests: forged ones stop at the gate, verified ones pass -->
  <g stroke-linecap="round">
    <line x1="96" y1="250" x2="196" y2="250" stroke="#475569" stroke-width="6" stroke-dasharray="2 18"/>
    <line x1="96" y1="320" x2="196" y2="320" stroke="#475569" stroke-width="6" stroke-dasharray="2 18"/>
    <line x1="96" y1="390" x2="196" y2="390" stroke="#475569" stroke-width="6" stroke-dasharray="2 18"/>
    <line x1="404" y1="320" x2="456" y2="320" stroke="#22c55e" stroke-width="6"/>
    <path d="M444 306 L460 320 L444 334" fill="none" stroke="#22c55e" stroke-width="6" stroke-linejoin="round"/>
  </g>

  <!-- gate -->
  <rect x="210" y="186" width="180" height="268" rx="28" fill="#111a2e" stroke="#22c55e" stroke-width="8"/>
  <rect x="236" y="214" width="16" height="212" rx="8" fill="#1e293b"/>
  <rect x="348" y="214" width="16" height="212" rx="8" fill="#1e293b"/>
  <path d="M262 324 L292 354 L340 290" fill="none" stroke="#22c55e" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="530" y="300" font-family="Inter, sans-serif" font-size="112" font-weight="800" letter-spacing="-3" fill="#f8fafc">hookgate</text>
  <text x="534" y="372" font-family="Inter, sans-serif" font-size="34" font-weight="500" fill="#cbd5e1">Verify every webhook.</text>
  <text x="534" y="418" font-family="Inter, sans-serif" font-size="34" font-weight="500" fill="#cbd5e1">Forward only the <tspan fill="#22c55e" font-weight="700">real</tspan> ones.</text>
  <text x="534" y="500" font-family="Inter, sans-serif" font-size="24" font-weight="500" fill="#64748b">github.com/mrrobertkent/hookgate</text>
</svg>
