version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: {interval: weekly}
    labels: [type/deps]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    labels: [type/deps]
    groups:
      # The CodeQL steps must share one version; analyze fails against a mismatched init.
      codeql-action:
        patterns: ["github/codeql-action*"]
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
    labels: [type/deps]
  - package-ecosystem: docker-compose
    directories: [/examples/compose, /examples/otel-collector, /examples/jetstream]
    schedule: {interval: weekly}
    labels: [type/deps, area/examples]
