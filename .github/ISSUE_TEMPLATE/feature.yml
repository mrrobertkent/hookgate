name: Feature request
description: A new signature scheme, upstream, or capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem, description: What are you trying to do that hookgate does not support?}
    validations: {required: true}
  - type: textarea
    id: sender
    attributes: {label: Sender documentation, description: For a signature scheme, link the provider's verification docs.}
  - type: textarea
    id: proposal
    attributes: {label: Proposed configuration, render: yaml}
