name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Fuzz the signature verifier
        run: go test -run='^$' -fuzz=FuzzHMAC -fuzztime=60s ./internal/verify
      - name: Validate the example configuration
        env:
          E2_WEBHOOK_TOKEN: example-token-value
          E2_SIGNING_SECRET: example-signing-secret
          GITHUB_WEBHOOK_SECRET: example-github-secret
          UPSTREAM_TOKEN: example-upstream-token
          CLICKHOUSE_USER: webhooks
          CLICKHOUSE_PASSWORD: example-password
        run: go run ./cmd/hookgate validate -config examples/hookgate.yaml
      - name: Validate the OpenTelemetry Collector example
        working-directory: examples/otel-collector
        env:
          GITHUB_WEBHOOK_SECRET: example-github-secret
          STORAGE_WEBHOOK_TOKEN: example-token-value
          STORAGE_SIGNING_SECRET: example-signing-secret
          UPSTREAM_TOKEN: example-upstream-token
          UPSTREAM_AUTHORIZATION: Bearer example-upstream-token
          CLICKHOUSE_USER: otel
          CLICKHOUSE_PASSWORD: example-password
        run: |
          go run ../../cmd/hookgate validate -config hookgate.yaml
          docker compose -f docker-compose.yml -f compose.clickhouse.yaml config --quiet
          collector=$(docker compose config --images | grep opentelemetry-collector)
          for config in collector.yaml collector.clickhouse.yaml; do
            docker run --rm -e UPSTREAM_TOKEN -e CLICKHOUSE_USER -e CLICKHOUSE_PASSWORD \
              --tmpfs /var/lib/otelcol/queue -v "$PWD/$config:/etc/otelcol-contrib/config.yaml:ro" \
              "$collector" validate --config=/etc/otelcol-contrib/config.yaml
          done
      - name: Validate the Docker Compose example
        working-directory: examples/compose
        env:
          GITHUB_WEBHOOK_SECRET: example-github-secret
        run: |
          go run ../../cmd/hookgate validate -config hookgate.yaml
          docker compose --profile demo config --quiet

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  sonar:
    runs-on: ubuntu-latest
    env:
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}   # false on fork pull requests; the scan is skipped there
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test with coverage
        if: env.HAS_SONAR_TOKEN == 'true'
        run: go test -count=1 -coverprofile=coverage.out ./...
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        if: env.HAS_SONAR_TOKEN == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
