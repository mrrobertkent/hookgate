name: hookgate-otel

services:
  hookgate:
    image: ghcr.io/mrrobertkent/hookgate:0.1.2@sha256:42a83e40387977d24a1f8e1ca8908cc9fec1a7fcf04fad2ace9ddf30185c976e
    ports: ["8080:8080"]
    environment:
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?}
      STORAGE_WEBHOOK_TOKEN: ${STORAGE_WEBHOOK_TOKEN:?}
      STORAGE_SIGNING_SECRET: ${STORAGE_SIGNING_SECRET:?}
      UPSTREAM_AUTHORIZATION: Bearer ${UPSTREAM_TOKEN:?}
    volumes:
      - ./hookgate.yaml:/etc/hookgate/hookgate.yaml:ro
    depends_on: [otel-collector]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.2@sha256:7f22d2a6748110ffb6a59bc0df448bccbf501cdb667d610ede4c61d3863d5849
    environment:
      UPSTREAM_TOKEN: ${UPSTREAM_TOKEN:?}
    volumes:
      - ./collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - queue:/var/lib/otelcol/queue
    depends_on:
      queue-permissions: {condition: service_completed_successfully}

  # The collector runs as uid 10001; a new named volume is owned by root.
  queue-permissions:
    image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    command: chown 10001:10001 /queue
    volumes:
      - queue:/queue

volumes:
  queue:
