# docker compose -f docker-compose.yml -f compose.clickhouse.yaml up -d
services:
  otel-collector:
    environment:
      CLICKHOUSE_USER: otel
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
    volumes:
      - ./collector.clickhouse.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      clickhouse: {condition: service_healthy}

  clickhouse:
    image: clickhouse/clickhouse-server:26.9.19.9@sha256:bdb5c911a23d92fd364e246ab20b5a0a485f00112f3663fa626b083fb46c146b
    environment:
      CLICKHOUSE_USER: otel
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
    volumes:
      - clickhouse:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "otel", "--password", "${CLICKHOUSE_PASSWORD}", "-q", "SELECT 1"]
      interval: 2s
      retries: 30

volumes:
  clickhouse:
