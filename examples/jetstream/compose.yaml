name: hookgate-jetstream

x-nats: &nats
  image: nats:2.15.3-alpine@sha256:558394a23dd3c36f2d3a64b51865fd09908010e80a542cea5e75c2af543ed62a
  command: ["nats-server", "--config", "/etc/nats/nats.conf"]
  # SIGTERM stops a server at once; lame duck mode first hands its leaderships and clients to the others.
  stop_signal: SIGUSR2
  stop_grace_period: 3m
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
    interval: 5s
    timeout: 3s
    start_period: 30s
    retries: 12
  depends_on:
    keys: {condition: service_completed_successfully}

services:
  # Generates the NKeys and the accounts file the servers include.
  keys:
    image: natsio/nats-box:0.20.2@sha256:5162fca0f56ebe6f78e612e1ded143ce978e088393476033020e6251358dba6f
    command: ["sh", "/scripts/keys.sh"]
    volumes:
      - ./keys.sh:/scripts/keys.sh:ro
      - keys-nats:/keys/nats
      - keys-admin:/keys/admin
      - keys-hookgate:/keys/hookgate
      - keys-relay:/keys/relay
      - keys-replay:/keys/replay

  nats-1:
    <<: *nats
    environment: {NATS_SERVER_NAME: nats-1}
    volumes: [./nats.conf:/etc/nats/nats.conf:ro, keys-nats:/etc/nats/keys:ro, nats-1:/data]
  nats-2:
    <<: *nats
    environment: {NATS_SERVER_NAME: nats-2}
    volumes: [./nats.conf:/etc/nats/nats.conf:ro, keys-nats:/etc/nats/keys:ro, nats-2:/data]
  nats-3:
    <<: *nats
    environment: {NATS_SERVER_NAME: nats-3}
    volumes: [./nats.conf:/etc/nats/nats.conf:ro, keys-nats:/etc/nats/keys:ro, nats-3:/data]

  # Creates the stream and the bucket once the cluster is up; also the NATS CLI for the commands in README.md.
  setup:
    image: natsio/nats-box:0.20.2@sha256:5162fca0f56ebe6f78e612e1ded143ce978e088393476033020e6251358dba6f
    command: ["sh", "/scripts/setup.sh"]
    environment:
      NATS_URL: nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      NATS_NKEY: /keys/admin.nk
    volumes:
      - ./setup.sh:/scripts/setup.sh:ro
      - keys-admin:/keys:ro
    depends_on:
      nats-1: {condition: service_healthy}
      nats-2: {condition: service_healthy}
      nats-3: {condition: service_healthy}

  hookgate:
    build:
      context: ../..
    image: hookgate:jetstream-example
    working_dir: /etc/hookgate
    environment:
      DEMO_WEBHOOK_TOKEN: ${DEMO_WEBHOOK_TOKEN:-demo-token-change-me}
    volumes:
      - ./hookgate.yaml:/etc/hookgate/hookgate.yaml:ro
      - keys-hookgate:/etc/hookgate/keys:ro
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    stop_grace_period: 40s        # above drain_delay + shutdown_timeout
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      setup: {condition: service_completed_successfully}

  # Stand-in for your application: accepts events, rejects those marked x-poison (see Caddyfile).
  handler:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Delivers the consumer's events to the handler.
  relay:
    build:
      context: ../..
      dockerfile: Dockerfile.relay
    image: hookgate-relay:jetstream-example
    working_dir: /etc/hookgate
    volumes:
      - ./relay.yaml:/etc/hookgate/relay.yaml:ro
      - keys-relay:/etc/hookgate/keys:ro
    ports:
      - "127.0.0.1:9091:9091"
    stop_grace_period: 40s        # above drain_timeout (25s) + 15s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      setup: {condition: service_completed_successfully}
      handler: {condition: service_healthy}

  # The operator's replay command, with its own identity: `docker compose run --rm replay -seq N`.
  replay:
    image: hookgate-relay:jetstream-example
    profiles: [tools]
    entrypoint: ["hookgate-relay", "replay", "-config", "/etc/hookgate/replay.yaml"]
    working_dir: /etc/hookgate
    volumes:
      - ./replay.yaml:/etc/hookgate/replay.yaml:ro
      - keys-replay:/etc/hookgate/keys:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  keys-nats:
  keys-admin:
  keys-hookgate:
  keys-relay:
  keys-replay:
  nats-1:
  nats-2:
  nats-3:
