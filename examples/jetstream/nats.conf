# One member of a three-node JetStream cluster; NATS_SERVER_NAME tells the members apart.
server_name: $NATS_SERVER_NAME
listen: 0.0.0.0:4222
http: 0.0.0.0:8222
# Above the largest max_body_bytes plus headers: dead-letter records carry whole bodies, also claim-checked ones.
max_payload: 8MB

jetstream {
  store_dir: /data
  # Sync every write to disk before acknowledging it, so a 200 survives a simultaneous power loss.
  sync_interval: always
}

cluster {
  name: webhooks
  listen: 0.0.0.0:6222
  routes: [nats://nats-1:6222, nats://nats-2:6222, nats://nats-3:6222]
}

# Accounts and users, written by the keys service from freshly generated NKeys.
include ./keys/auth.conf
